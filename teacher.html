<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Dashboard</title>
  <link rel="stylesheet" href="teacher.css">
</head>
<body>
  <div class="header">
    <div class="header-content">
      <div class="header-left">
        <div class="logo">👩‍🏫</div>
        <div>
          <h1>Teacher Dashboard</h1>
          <p>Manage department notices</p>
        </div>
      </div>
      <button class="btn-logout" onclick="logout()">Logout</button>
    </div>
  </div>

  <div class="container">
    <!-- Add Notice Section -->
    <div class="add-notice-card">
      <h2>📝 Create New Notice</h2>
      <div class="form-grid">
        <div class="form-group">
          <label for="title">Notice Title *</label>
          <input type="text" id="title" placeholder="Enter notice title">
        </div>

        <div class="form-group">
          <label for="category">Category *</label>
          <select id="category">
            <option value="Exam">Exam</option>
            <option value="Event">Event</option>
            <option value="Holiday">Holiday</option>
            <option value="General">General</option>
          </select>
        </div>

        <div class="form-group">
          <label for="priority">Priority Level *</label>
          <select id="priority">
            <option value="high">🔴 High Priority</option>
            <option value="medium" selected>🟡 Medium Priority</option>
            <option value="low">🟢 Low Priority</option>
          </select>
        </div>

        <div class="form-group">
          <label for="expiry">Expiry Date *</label>
          <input type="date" id="expiry">
        </div>

        <div class="form-group full-width">
          <label for="content">Notice Content *</label>
          <textarea id="content" placeholder="Enter detailed notice content" rows="4"></textarea>
        </div>

        <div class="form-actions full-width">
          <button class="btn btn-publish" onclick="addNotice()">
            ✓ Publish Notice
          </button>
          <button class="btn btn-clear" onclick="clearForm()">
            ✕ Clear Form
          </button>
        </div>
      </div>
    </div>

    <!-- Filter Section -->
    <div class="filter-section">
      <h2>📋 All Active Notices</h2>
      <div class="filter-controls">
        <select id="categoryFilter" onchange="displayNotices()">
          <option value="All">All Categories</option>
          <option value="Exam">Exam</option>
          <option value="Event">Event</option>
          <option value="Holiday">Holiday</option>
          <option value="General">General</option>
        </select>
        <select id="priorityFilter" onchange="displayNotices()">
          <option value="All">All Priorities</option>
          <option value="high">High Priority</option>
          <option value="medium">Medium Priority</option>
          <option value="low">Low Priority</option>
        </select>
        <span class="notice-count">Total: <span id="noticeCount">0</span></span>
      </div>
    </div>

    <div id="noticeList" class="notice-grid"></div>
  </div>

  <script src="common.js"></script>
  <script src="teacher.js"></script>
</body>
</html>
